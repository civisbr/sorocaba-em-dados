[project]
name = "sorocaba-sp"
version = "0.1.0"
description = "Sorocaba em Dados — hub de dados públicos municipais"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "selectolax>=0.3",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "py7zr>=0.21",
    "python-calamine>=0.8.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = []
