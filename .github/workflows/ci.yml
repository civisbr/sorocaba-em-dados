name: ci

on:
  pull_request:

permissions: {}

jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python -m scripts.render --saida "$RUNNER_TEMP/dist"
