name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [data/**, README.md, docs/**]

permissions: {}

jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python -m scripts.render --saida "$RUNNER_TEMP/dist"
