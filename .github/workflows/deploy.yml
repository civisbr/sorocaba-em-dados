name: deploy

on:
  push:
    branches: [main]
    paths: [data/public/**, templates/**, static/**, scripts/render.py, scripts/charts.py, scripts/mapa.py, scripts/paineis.py, scripts/contexto_hospitais.py, scripts/contexto_panorama.py, scripts/contexto_vacinas.py, scripts/contexto_inmetro.py, scripts/contexto_mapa_saude.py, scripts/mapa_base.py, data/raw/osm/**, scripts/saude_codigos.py, scripts/infosiga_regras.py, scripts/geo.py, data/raw/ibge/**]
  schedule:
    - cron: "30 9 * * *"  # renova a previsão do tempo todo dia (06h30 em Brasília)
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Previsão do tempo (efêmera, não vai para o git)
        run: |
          if uv run python -m scripts.fetch_previsao --acesso-em "$(date -u +%F)" && uv run python -m scripts.build_previsao; then
            echo "previsão publicada; sha256 de data/public/previsao.json: $(sha256sum data/public/previsao.json | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
            for fonte in inmet open_meteo; do
              [ -f "data/raw/previsao/$fonte.json" ] || { echo "::warning::fonte de previsão ausente neste deploy: $fonte"; echo "Fonte de previsão ausente neste deploy: $fonte" >> "$GITHUB_STEP_SUMMARY"; }
            done
          else
            echo "::warning::previsão indisponível; o site sai sem ela"
            echo "Previsão indisponível neste deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: uv run python -m scripts.render
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  alerta:
    needs: [build, deploy]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir issue em falha
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          titulo="Falha na publicação do site"
          aberta=$(gh issue list --state open --search "\"$titulo\" in:title" --json number,title --jq "[.[] | select(.title == \"$titulo\")][0].number")
          if [ -n "$aberta" ] && [ "$aberta" != "null" ]; then
            gh issue comment "$aberta" --body "Nova falha: $url"
          else
            gh issue create --title "$titulo" --body "Execução: $url. O site continua com a versão anterior."
          fi
