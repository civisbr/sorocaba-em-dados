name: comparativo

on:
  schedule:
    - cron: "0 12 17 * *"
  workflow_dispatch:

permissions: {}

concurrency: atualizacao-${{ github.workflow }}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - name: Fetch
        run: uv run python -m scripts.fetch_comparativo --acesso-em "$(date -u +%F)"
      - name: Build
        run: uv run python -m scripts.build_comparativo
      - run: uv run pytest -q
      - name: Commitar se mudou
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/public data/raw/comparativo
          if git diff --cached --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza comparativo.json" -m "Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            git_auth() { GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="Authorization: Basic ${auth}" git "$@"; }
            git_auth pull -q --rebase "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF_NAME}"
            env -u GH_TOKEN uv run pytest -q
            git_auth push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:"${GITHUB_REF_NAME}"
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Disparar deploy
        if: steps.commit.outputs.mudou == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Abrir issue em falha
        if: failure() || cancelled()
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          titulo="Falha na atualização do comparativo"
          aberta=$(gh issue list --state open --search "$titulo in:title" --json number --jq '.[0].number')
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body "Nova falha: $url"
          else
            gh issue create --title "$titulo" --body "Execução: $url. O site continua servindo o JSON anterior."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
